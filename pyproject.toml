[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-wiki"
dynamic = ["version"]
description = "GIST HURGroup LLM-Wiki - lab knowledge compilation system"
requires-python = ">=3.12"
dependencies = []          # 코어는 의존성 0 (N8). 선택 기능은 extras로.

[project.optional-dependencies]
pdf = ["pypdf>=4"]              # 비 macOS 페이지 검사
# API key 백엔드 — OAuth(CLI) 경로만 쓰면 아무것도 설치할 필요 없다.
anthropic = ["anthropic>=0.40"]
openai = ["openai>=1.60"]
gemini = ["google-genai>=1.0"]
llm = ["anthropic>=0.40"]       # 하위 호환 별칭
all = ["pypdf>=4", "anthropic>=0.40", "openai>=1.60", "google-genai>=1.0"]

[project.scripts]
llm-wiki = "llm_wiki.cli:main"

[tool.setuptools]
packages = ["llm_wiki"]
# MANIFEST.in의 graft와 함께 템플릿의 숨김 폴더(.llm-wiki·.claude)까지 확실히 담는다.
# package-data 글롭만으로는 점으로 시작하는 폴더 *안쪽*이 누락된다 (0.2.x에서 .llm-wiki 통째 누락).
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "llm_wiki.__version__"}

[tool.setuptools.package-data]
llm_wiki = ["templates/**/*", "templates/**/.*",
            "templates/**/.claude/**/*", "templates/**/.llm-wiki/**/*"]
